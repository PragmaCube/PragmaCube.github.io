		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}

## Position

La position $\overrightarrow{\textbf{x}}(t)$ d'un objet est un **vecteur** dépendant du temps donnant ses coordonnées dans l'espace. En 3 dimensions, on note
$$
\overrightarrow{\textbf{x}}(t)=\begin{pmatrix}x(t)\newline y(t)\newline z(t)\end{pmatrix}
$$

</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Vitesse

La vitesse $\overrightarrow{\textbf{v}}(t)$ d'un objet est un **vecteur** dépendant du temps donnant la variation instantannée de la position. En 3 dimensions, on note
$$
\overrightarrow{\textbf{v}}(t)=\begin{pmatrix}v_x(t)\newline v_y(t)\newline v_z(t)\end{pmatrix}
$$

</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Accélération

L'accélération $\overrightarrow{\textbf{a}}(t)$ d'un objet est un **vecteur** dépendant du temps donnant la variation instantannée de la vitesse. En 3 dimensions, on note
$$
\overrightarrow{\textbf{a}}(t)=\begin{pmatrix}a_x(t)\newline a_y(t)\newline a_z(t)\end{pmatrix}
$$

</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Position, vitesse et accélération

La vitesse est la dérivée temporelle de la position. L'accélération est la dérivée temporelle de la vitesse.
$$
\overrightarrow{\textbf{a}}(t)=\overrightarrow{\textbf{v}}'(t)=\overrightarrow{\textbf{x}}''(t)=\begin{pmatrix}x''(t)\newline y''(t)\newline z''(t)\end{pmatrix}
$$

</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Force

Une force $\overrightarrow{F}$ est un vecteur modélisant la capacité de quelque chose à modifier la position ou à déformer un objet.
- Force gravitationnelle : les objets exercent une force d'attraction entre eux (ex : on tombe car la Terre nous attire vers elle)
- Force de frottements : un avion rencontre un obstacle dans sa trajectoire (l'air), ce qui le ralentit
- Force de pression : un ballon se déforme lorsqu'il est frappé

</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Énergie

Mesure l'état d'un système. Plusieurs définitions selon le contexte. Deux cas principaux en mécanique :
- Énergie cinétique $E_c$ : plus un objet va vite, plus il a de l'énergie (plus la force nécessaire pour l'arrêter est grande)
- Énergie potentielle de pesanteur $E_{pp}$ : plus un objet est haut (par rapport au sol), plus il va accélérer en tombant

</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# Lois de Newton

</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## 1ère loi de Newton (principe d'inertie)

« Dans un référentiel galiléen, tout corps sur lequel aucune force ne s'applique reste au repos ou en mouvement rectiligne uniforme »
- Référentiel galiléen : en gros, le sol
- Mouvement rectiligne uniforme : mouvement en ligne droite à vitesse constante

</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## 2e loi de Newton (relation fondamentale de la dynamique)

Soit $\overrightarrow{F_{ext}}$ la somme des forces extérieures agissant sur un objet de masse $m$ et de position $\overrightarrow{\textbf{x}}$. Alors
$$
\overrightarrow{F_{ext}}
=m\overrightarrow{\textbf{x}}''
=m\overrightarrow{\textbf{a}}
$$

</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## 3e loi de Newton (principe d'action-réaction)

Soit $A$ un objet exerçant une force $\overrightarrow{F}$ sur un objet $B$. Alors $B$ exerce une force $-\overrightarrow{F}$ sur $A$.

</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Résolution de problème

1. Lister toutes les données connues
2. Faire un bilan des forces
3. Trouver les forces influençant le mouvement
4. Choisir un référentiel
5. Appliquer la 2e loi de Newton
6. Résoudre l'équation différentielle

</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Exemple

- Une pente fait un angle $\alpha$ avec le sol et un cube de masse $m$ est posé dessus
- Les coefficients de frottements statique et cinétique sont respectivement $\mu_s$ et $\mu_c$
- La distance entre l'extrémité avant du cube et le bout de la pente est $d$
- La position initiale est 0 et la vitesse initiale est 0

<img src="../assets/img/meca/probleme1.png" width="500px">

</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Exemple

- Les frottements statiques « empêchent » les objets de tomber (les frottements compensent le mouvement)
- Les frottements cinétiques « entraves » les objets en train de tomber (les frottements ralentissent le mouvement)
- La norme des frottements statiques et cinétiques est proportionnelle à la réaction normale du poids de l'objet (avec coefficient de proportionnalité $\mu_s$ et $\mu_c$)

</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Exemple

1. Trouver l'angle $\alpha_0$ à partir duquel il y a mouvement
2. Lorsque la pente fait un angle $\alpha_0$ avec le sol, trouver le temps de descente du cube

</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Bilan des forces

1. Poids du cube $\overrightarrow{P}$
2. Frottements statiques $\overrightarrow{f_s}$ et cinétiques $\overrightarrow{f_c}$
3. Réaction normale du sol $\overrightarrow{N}$ (n'influence pas le mouvement)

</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Choix du référentiel

La pente (choix naturel car le mouvement est parallèle à la pente). 

</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Déterminer $\alpha_0$

$\overrightarrow{f_s}$ compense le mouvement si la composante du poids influençant le mouvement est plus petite que la norme de $\overrightarrow{f_s}$ : $\mu_smg\cos\alpha> mg\sin\alpha$

<img src="../assets/img/meca/triangle1.png" width="500px">

</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Déterminer $\alpha_0$

$\alpha_0$ est la valeur critique où 
$$
\mu_smg\cos\alpha_0= mg\sin\alpha_0\Longleftrightarrow \alpha_0=\arctan(\mu_s)
$$

</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Appliquer la 2e loi de Newton

$$
\overrightarrow{f_c}+\overrightarrow{P_c}=m\overrightarrow{\textbf{x}''}
$$

Sur l'axe du mouvement, cela donne
$$
-\mu_c mg\cos\alpha_0 + mg \sin \alpha_0 = mx''(t)\Longleftrightarrow x''(t)=g(\sin\alpha_0-\mu_c\cos\alpha_0)
$$

</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Résoudre l'équation différentielle

$$
x''(t)=g(\sin\alpha_0-\mu_c\cos\alpha_0)\Longleftrightarrow x'(t)=g(\sin\alpha_0-\mu_c\cos\alpha_0)t + C_1\newline
\\
\Longleftrightarrow x(t)=\frac{1}{2}g(\sin\alpha_0-\mu_c\cos\alpha_0)t^2 + C_1t + C_2
$$
Avec les conditions initiales $x(0)=0$ et $x'(0)=0$, on trouve $x(t)=\frac{1}{2}g(\sin\alpha_0-\mu_c\cos\alpha_0)t^2$
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Déterminer le temps de descente

Soit $T$ le temps de descente. On a 
$$
x(T)=d\Longleftrightarrow \frac{1}{2}g(\sin\alpha_0-\mu_c\cos\alpha_0)T^2 = d\newline
\Longleftrightarrow T=\sqrt{\frac{2d}{g(\sin\alpha_0-\mu_c\cos\alpha_0)}}.
$$

</script></section></div>

		let hex = color.replace('#', '');

		if(hex.length == 3){
			hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
		}

		const c_r = parseInt(hex.substr(0, 2), 16);
		const c_g = parseInt(hex.substr(2, 2), 16);
		const c_b = parseInt(hex.substr(4, 2), 16);
		const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
		return brightness > 155;
	}

		<script>
		(function(){
			function buildTOC(){
				var list = document.getElementById('toc-list');
				if(!list) return;
				list.innerHTML = '';
				var slides = document.querySelectorAll('.reveal .slides > section');
				slides.forEach(function(section, i){
					var contentDiv = section.querySelector('div[id]');
					if(!contentDiv) return;
					var id = contentDiv.id;
					var titleEl = contentDiv.querySelector('h1,h2,h3,h4,strong');
					var title = (titleEl && titleEl.innerText.trim()) || id;
					var li = document.createElement('li');
					var a = document.createElement('a');
					a.href = 'javascript:void(0)';
					a.textContent = String(title).charAt(0).toUpperCase() + String(title).toLowerCase().slice(1);
					a.addEventListener('click', function(e){
						Reveal.slide(i);
						toggleTOC();
					});
					li.appendChild(a);
					list.appendChild(li);
				});
			}

			window.toggleTOC = function(){
				var overlay = document.getElementById('toc-overlay');
				if(!overlay) return;
				overlay.classList.toggle('visible');
				overlay.setAttribute('aria-hidden', !overlay.classList.contains('visible'));
				if(overlay.classList.contains('visible')) buildTOC();
			};

			document.addEventListener('DOMContentLoaded', function(){
				var closeBtn = document.querySelector('#toc-overlay .toc-close');
				if(closeBtn) closeBtn.addEventListener('click', toggleTOC);
			});
